# test suite for guest-originated packet injection
# covers OUTPUT and INPUT hooks using automatic guest injection detection

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "203.0.113.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "203.0.113.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# a guest IP as source should be injected from the guest
[[tests]]
name = "OUTPUT hook - HTTP from guest to internet"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "192.168.1.1", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "output", verdict = "accept" } ]

[[tests]]
name = "OUTPUT hook - ICMP from guest to internet"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "192.168.1.1", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0 } }
expect = [ { hook = "output", verdict = "accept" } ]

# forwarded traffic should use host injection, NOT guest injection
[[tests]]
name = "FORWARD hook - internal to external (host injection)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]
