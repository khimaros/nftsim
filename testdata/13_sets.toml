# test suite 13: nftables sets and maps
#
# set matching, interval sets and maps

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

[[tests]]
name = "blocked IP set - traffic dropped"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "192.168.1.50", tcp = { source_port = 50000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "5.6.7.8", dest_ip = "192.168.1.50", tcp = { source_port = 50001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "9.10.11.12", dest_ip = "192.168.1.50", tcp = { source_port = 50002, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "non-blocked IP - processed normally"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 40000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "allowed ports set - HTTP allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "allowed ports set - HTTPS allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "allowed ports set - 8080 allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45002, dest_port = 8080, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "disallowed port - dropped"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45003, dest_port = 25, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45004, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "DMZ interval set - first IP in range"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "10.99.0.10", tcp = { source_port = 50000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "DMZ interval set - middle IP in range"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "10.99.0.15", tcp = { source_port = 50001, dest_port = 3389, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "DMZ interval set - last IP in range"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "10.99.0.20", tcp = { source_port = 50002, dest_port = 445, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "IP outside DMZ range - dropped"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "10.99.0.9", tcp = { source_port = 50003, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "10.99.0.21", tcp = { source_port = 50004, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "blocked IP to firewall input - dropped"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "1.2.3.4", dest_ip = "192.168.1.1", tcp = { source_port = 60000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "multiple ports from allowed set"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 30001, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 30002, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 30003, dest_port = 8443, flags = ["SYN"] } }
