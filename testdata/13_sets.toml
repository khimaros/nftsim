# Test suite 13: nftables Sets and Maps
#
# Tests set matching, interval sets, and maps

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# Test 1: Traffic from blocked IP - dropped
[[tests]]
name = "Blocked IP Set - Traffic Dropped"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "192.168.1.50", tcp = { source_port = 50000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "5.6.7.8", dest_ip = "192.168.1.50", tcp = { source_port = 50001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "9.10.11.12", dest_ip = "192.168.1.50", tcp = { source_port = 50002, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

# Test 2: Traffic from non-blocked IP - processed normally
[[tests]]
name = "Non-Blocked IP - Processed Normally"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 40000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

