[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

[[tests]]
name = "Multiple allowed TCP ports"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50002, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "SMTP ports (25, 587)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50100, dest_port = 25, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50101, dest_port = 587, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "Multiple UDP services"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 50200, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 50201, dest_port = 123 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 50202, dest_port = 514 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "Blocked TCP port"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50300, dest_port = 3389, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "Blocked UDP port"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 50400, dest_port = 69 } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "Mixed protocol concurrent connections"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 50500, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 50500, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "Sequential different protocols same source"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.60", dest_ip = "8.8.8.8", tcp = { source_port = 50600, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.60", tcp = { source_port = 443, dest_port = 50600, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.60", dest_ip = "8.8.8.8", udp = { source_port = 50601, dest_port = 123 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.60", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "Established TCP with interleaved UDP"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.70", dest_ip = "8.8.8.8", tcp = { source_port = 50700, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.70", tcp = { source_port = 80, dest_port = 50700, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.70", dest_ip = "8.8.8.8", udp = { source_port = 50701, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.70", dest_ip = "8.8.8.8", tcp = { source_port = 50700, dest_port = 80, flags = ["ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]
