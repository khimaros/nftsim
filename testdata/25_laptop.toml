# Laptop firewall tests
# Tests simple laptop/workstation firewall with selective service access

[network]
interfaces = [
  { name = "wlp170s0", ip = "192.168.1.100/24" },  # WiFi interface
  { name = "wg0", ip = "10.1.200.170/24" },       # VPN interface 0
  { name = "wg1", ip = "10.1.201.170/24" },       # VPN interface 1
]

routes = [
  { destination = "0.0.0.0/0", via = "192.168.1.1" },
]

[guest_setup]
sysctls = {}

# ===== INPUT CHAIN TESTS =====

[[tests]]
name = "ICMP to laptop accepted"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.50", dest_ip = "192.168.1.100", icmp = { type = "echo-request", code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "mDNS from WAN accepted (UDP 5353)"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.50", dest_ip = "192.168.1.100", udp = { source_port = 51000, dest_port = 5353 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "LLMNR from WAN accepted (TCP 5355)"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.50", dest_ip = "192.168.1.100", tcp = { source_port = 52000, dest_port = 5355, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "LLMNR from WAN accepted (UDP 5355)"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.50", dest_ip = "192.168.1.100", udp = { source_port = 53000, dest_port = 5355 } }
