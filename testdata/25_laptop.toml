# ===== FORWARD AND OUTPUT CHAIN TESTS =====
# Note: FORWARD and OUTPUT chains have no rules (default policy applies)

[[tests]]
name = "Outbound HTTP accepted (default OUTPUT policy)"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 50001, dest_port = "http", flags = ["SYN"] } }
expect = [ { hook = "output", verdict = "accept" } ]

[[tests]]
name = "Outbound HTTPS accepted (default OUTPUT policy)"
[[tests.packets]]
packet = { on_interface = "wlp170s0", source_ip = "192.168.1.100", dest_ip = "1.1.1.1", tcp = { source_port = 50002, dest_port = "https", flags = ["SYN"] } }
expect = [ { hook = "output", verdict = "accept" } ]
