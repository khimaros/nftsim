# accept verdict tests for packets destined to the firewall itself

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = []

[guest_setup]
sysctls = {}
pre_nft_commands = []
post_nft_commands = []

[[tests]]
name = "SSH to firewall - accept"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", tcp = { source_port = 50000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

# HTTP is not in the allowed set
[[tests]]
name = "HTTP to firewall - drop"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", tcp = { source_port = 50001, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "DNS to firewall from internal - drop"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", tcp = { source_port = 50002, dest_port = 53, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "external access to firewall - drop"
[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.0.0.1", tcp = { source_port = 12345, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]
