# test suite 11: security and edge cases
#
# security features like invalid packet handling

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# baseline
[[tests]]
name = "normal outbound TCP connection"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 40000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.50", tcp = { source_port = 80, dest_port = 40000, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests]]
name = "unsolicited external connection - blocked"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "192.168.1.50", tcp = { source_port = 50000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "SSH from internal network - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "192.168.1.1", tcp = { source_port = 55000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "SSH from external network - blocked"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.0.0.1", tcp = { source_port = 55000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "ICMP ping to firewall - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

# there is no rule for external ICMP
[[tests]]
name = "ICMP from external to firewall - blocked"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.0.0.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "UDP outbound - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "8.8.8.8", udp = { source_port = 60000, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.75", udp = { source_port = 53, dest_port = 60000 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests]]
name = "multi-protocol concurrent traffic"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.10", dest_ip = "1.1.1.1", tcp = { source_port = 30001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.11", dest_ip = "8.8.4.4", udp = { source_port = 30002, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.12", dest_ip = "1.1.1.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "established connection persistence"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.99", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.99", tcp = { source_port = 80, dest_port = 45000, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.99", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.99", tcp = { source_port = 80, dest_port = 45000, flags = ["ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.99", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]
