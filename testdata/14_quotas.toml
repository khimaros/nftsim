# Test 6: DNS (uncounted traffic)
[[tests]]
name = "DNS - Uncounted Traffic Allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.90", dest_ip = "8.8.8.8", udp = { source_port = 55000, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

# Test 7: Established connections (counted in stateful tracking)
[[tests]]
name = "Established Connection - HTTP Full Handshake"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 60000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.100", tcp = { source_port = 80, dest_port = 60000, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 60000, dest_port = 80, flags = ["ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

