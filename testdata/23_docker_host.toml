[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 63000, dest_port = 8096, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.28" },
