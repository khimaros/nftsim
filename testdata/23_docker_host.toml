# Docker host firewall tests
# Docker networking with VPN, NAT and container port forwarding

[network]
interfaces = [
  { name = "enp1s0", ip = "192.168.0.115/24" },  # WAN interface
  { name = "docker0", ip = "172.17.0.1/16" },    # Docker network 0
  { name = "docker1", ip = "172.16.0.1/16" },    # Docker network 1
  { name = "wg0", ip = "10.1.200.1/24" },        # VPN interface
]

routes = [
  { destination = "0.0.0.0/0", via = "192.168.0.1" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# ===== INPUT chain tests =====

[[tests]]
name = "ICMP to host accepted"
[[tests.packets]]
packet = { on_interface = "enp1s0", source_ip = "192.168.0.50", dest_ip = "192.168.0.115", icmp = { type = "echo-request", code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "SSH from WAN accepted"
[[tests.packets]]
packet = { on_interface = "enp1s0", source_ip = "203.0.113.50", dest_ip = "192.168.0.115", tcp = { source_port = 50000, dest_port = "ssh", flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "SSH from VPN accepted"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 51000, dest_port = "ssh", flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "DNS from docker0 to host accepted (UDP)"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "172.17.0.1", udp = { source_port = 52000, dest_port = "domain" } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "DNS from docker1 to host accepted (TCP)"
[[tests.packets]]
packet = { on_interface = "docker1", source_ip = "172.16.0.10", dest_ip = "172.16.0.1", tcp = { source_port = 53000, dest_port = "domain", flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "HTTPS from VPN to host accepted (host-mode proxy container)"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 54000, dest_port = "https", flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "metrics exporter from VPN to host accepted"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 55000, dest_port = 9100, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "package proxy from docker0 accepted"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "172.17.0.1", tcp = { source_port = 56000, dest_port = 8000, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "random port from Docker rejected"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "172.17.0.1", tcp = { source_port = 57000, dest_port = 9999, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "reject" } ]

# ===== NAT PREROUTING tests - DNAT to containers =====

[[tests]]
name = "VPN to file share Samba port 139 - DNAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 60000, dest_port = 139, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.15" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to file share Samba port 445 - DNAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 61000, dest_port = 445, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.15" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to source control (git) - DNAT to port 22"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 62000, dest_port = 2222, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.17" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to wiki - DNAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 63000, dest_port = 3000, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.19" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to notebook service - DNAT to port 8888"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 64000, dest_port = 8890, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.23" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to backup service - DNAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 65000, dest_port = 8200, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.13" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to feed reader - DNAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "10.1.200.1", tcp = { source_port = 50001, dest_port = 8081, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "172.16.0.21" },
  { hook = "forward", verdict = "accept", to_interface = "docker1" },
]

[[tests]]
name = "VPN to unmapped Docker port - rejected at NAT"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "172.16.0.99", tcp = { source_port = 50002, dest_port = 9999, flags = ["SYN"] } }
expect = [ { hook = "prerouting", verdict = "accept" } ]

# ===== FORWARD chain tests - Docker to internet =====

[[tests]]
name = "docker0 to internet forwarded with masquerade"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "8.8.8.8", tcp = { source_port = 50003, dest_port = "https", flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "enp1s0" },
  { hook = "postrouting", verdict = "accept", src_nat = "192.168.0.115" },
]

[[tests]]
name = "docker1 to internet forwarded with masquerade"
[[tests.packets]]
packet = { on_interface = "docker1", source_ip = "172.16.0.10", dest_ip = "1.1.1.1", tcp = { source_port = 50004, dest_port = "http", flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "enp1s0" },
  { hook = "postrouting", verdict = "accept", src_nat = "192.168.0.115" },
]

[[tests]]
name = "docker0 to docker1 blocked by isolation"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "172.16.0.20", tcp = { source_port = 50005, dest_port = "http", flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "docker1 to docker0 blocked by isolation"
[[tests.packets]]
packet = { on_interface = "docker1", source_ip = "172.16.0.10", dest_ip = "172.17.0.20", tcp = { source_port = 50006, dest_port = "http", flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "docker0 to docker0 allowed (same network)"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "172.17.0.20", tcp = { source_port = 50007, dest_port = "http", flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "docker0" } ]

[[tests]]
name = "docker1 to docker1 allowed (same network)"
[[tests.packets]]
packet = { on_interface = "docker1", source_ip = "172.16.0.10", dest_ip = "172.16.0.20", tcp = { source_port = 50008, dest_port = "http", flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "docker1" } ]

# ===== PREROUTING invalid state tests =====

[[tests]]
name = "invalid state dropped at prerouting (SYN+FIN)"
[[tests.packets]]
packet = { on_interface = "enp1s0", source_ip = "203.0.113.50", dest_ip = "192.168.0.115", tcp = { source_port = 50009, dest_port = "ssh", flags = ["SYN", "FIN"] } }
expect = [ { hook = "prerouting", verdict = "drop" } ]

# ===== ICMP tests =====

[[tests]]
name = "ICMP from Docker accepted at prerouting NAT"
[[tests.packets]]
packet = { on_interface = "docker0", source_ip = "172.17.0.10", dest_ip = "8.8.8.8", icmp = { type = "echo-request", code = 0 } }
expect = [ { hook = "prerouting", verdict = "accept" } ]
