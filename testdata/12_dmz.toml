# test suite 12: DMZ / 3-interface firewall
#
# a realistic DMZ setup with internal, external and DMZ zones

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "203.0.113.10/24" },
  { name = "eth2", ip = "10.99.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "203.0.113.1" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

[[tests]]
name = "internal to external - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 40000, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "internal to DMZ web server - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "10.99.0.50", tcp = { source_port = 50000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "10.99.0.50", tcp = { source_port = 50001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

# only web ports are open from internal to the DMZ
[[tests]]
name = "internal to DMZ SSH - blocked"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "10.99.0.50", tcp = { source_port = 50002, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "external to DMZ web server - allowed"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.99.0.50", tcp = { source_port = 60000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "5.6.7.8", dest_ip = "10.99.0.51", tcp = { source_port = 60001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

[[tests]]
name = "external to DMZ SSH - blocked"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.99.0.50", tcp = { source_port = 60002, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

# the DMZ is untrusted
[[tests]]
name = "DMZ to internal - blocked"

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.50", dest_ip = "192.168.1.100", tcp = { source_port = 55000, dest_port = 445, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "drop" } ]

# DMZ hosts still need to fetch updates
[[tests]]
name = "DMZ to external - allowed"

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.50", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "SSH to firewall from internal - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.10", dest_ip = "192.168.1.1", tcp = { source_port = 50000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "SSH to firewall from DMZ - blocked"

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.50", dest_ip = "10.99.0.1", tcp = { source_port = 50000, dest_port = 22, flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "drop" } ]

[[tests]]
name = "ICMP from internal to firewall - allowed"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "ICMP from DMZ to firewall - allowed"

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.50", dest_ip = "10.99.0.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "DMZ web server response - allowed (established)"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.99.0.50", tcp = { source_port = 60000, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.50", dest_ip = "1.2.3.4", tcp = { source_port = 80, dest_port = 60000, flags = ["SYN", "ACK"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "multi-zone concurrent traffic"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.20", dest_ip = "8.8.8.8", tcp = { source_port = 30001, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "9.10.11.12", dest_ip = "10.99.0.51", tcp = { source_port = 30002, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth2" } ]

[[tests.packets]]
packet = { on_interface = "eth2", source_ip = "10.99.0.52", dest_ip = "1.1.1.1", tcp = { source_port = 30003, dest_port = 443, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]
