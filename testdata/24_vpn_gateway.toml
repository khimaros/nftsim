# ===== port forwarding from WAN to VPN peer =====

[[tests]]
name = "WAN to gateway port 4242 - DNAT to peer_charlie with masquerade"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "203.0.113.50", dest_ip = "203.0.113.251", tcp = { source_port = 50014, dest_port = 4242, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "10.1.200.115" },
  { hook = "forward", verdict = "accept", to_interface = "wg0" },
  { hook = "postrouting", verdict = "accept", src_nat = "10.1.200.1" },
]

