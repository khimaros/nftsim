# ===== FORWARD CHAIN TESTS - VPN TO WAN =====

[[tests]]
name = "peer_aether (10.1.200.50) to internet with masquerade"
[[tests.packets]]
packet = { on_interface = "wg0", source_ip = "10.1.200.50", dest_ip = "8.8.8.8", tcp = { source_port = 60000, dest_port = "https", flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth0" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.251" },
]

[[tests]]
name = "peer_deimos (10.1.200.115) to internet with masquerade"
