# VPN gateway firewall tests
# VPN gateway with peer-based routing, masquerading and port forwarding

[network]
interfaces = [
  { name = "eth0", ip = "203.0.113.251/24" },   # WAN interface
  { name = "wg0", ip = "10.1.200.1/24" },       # VPN interface
]

routes = [
  { destination = "0.0.0.0/0", via = "203.0.113.1" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# ===== INPUT chain tests =====

[[tests]]
name = "ICMP to gateway accepted"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "203.0.113.50", dest_ip = "203.0.113.251", icmp = { type = "echo-request", code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "SSH from WAN accepted"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "203.0.113.50", dest_ip = "203.0.113.251", tcp = { source_port = 50000, dest_port = "ssh", flags = ["SYN"] } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
