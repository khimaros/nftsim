# ===== PORT FORWARDING FROM WAN TO VPN PEER =====

[[tests]]
name = "WAN to gateway port 51413 - DNAT to peer_deimos with masquerade"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "203.0.113.50", dest_ip = "203.0.113.251", tcp = { source_port = 50014, dest_port = 51413, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "10.1.200.115" },
  { hook = "forward", verdict = "accept", to_interface = "wg0" },
  { hook = "postrouting", verdict = "accept", src_nat = "10.1.200.1" },
]

