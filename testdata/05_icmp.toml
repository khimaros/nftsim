# ICMP protocol tests

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }
pre_nft_commands = []
post_nft_commands = []

[[tests]]
name = "ping from internal allowed"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "ping reply allowed"
[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "192.168.1.50", icmp = { type = 0, code = 0 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth0" } ]

[[tests]]
name = "external ping to internal dropped"
[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "192.168.1.50", icmp = { type = 8, code = 0 } }
expect = [ { hook = "forward", verdict = "drop" } ]

[[tests]]
name = "ping to firewall from internal"
[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "192.168.1.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "accept" } ]

[[tests]]
name = "external ping to firewall dropped"
[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "10.0.0.1", icmp = { type = 8, code = 0 } }
expect = [ { hook = "input", verdict = "drop" } ]
