# test suite 21: TCP/UDP payload support
# packet injection with payload data for TCP and UDP

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "10.0.0.1/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "10.0.0.2" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# ASCII payload
[[tests]]
name = "TCP with HTTP-like payload"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"], payload = [0x47, 0x45, 0x54, 0x20, 0x2f] } }  # "GET /"
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "TCP with binary payload"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.51", dest_ip = "8.8.8.8", tcp = { source_port = 45001, dest_port = 443, flags = ["SYN"], payload = [0x16, 0x03, 0x01, 0x00, 0x05] } }  # TLS handshake start
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "TCP with longer payload (32 bytes)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.52", dest_ip = "8.8.8.8", tcp = { source_port = 45002, dest_port = 80, flags = ["SYN"], payload = [0x48, 0x54, 0x54, 0x50, 0x2f, 0x31, 0x2e, 0x31, 0x20, 0x32, 0x30, 0x30, 0x20, 0x4f, 0x4b, 0x0d, 0x0a, 0x43, 0x6f, 0x6e, 0x74, 0x65, 0x6e, 0x74, 0x2d, 0x54, 0x79, 0x70, 0x65, 0x3a, 0x20, 0x61] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "UDP with DNS query payload"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", udp = { source_port = 53000, dest_port = 53, payload = [0x12, 0x34, 0x01, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00] } }  # DNS query header
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "UDP with small payload (4 bytes)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.51", dest_ip = "8.8.8.8", udp = { source_port = 53001, dest_port = 53, payload = [0x41, 0x42, 0x43, 0x44] } }  # "ABCD"
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "UDP with larger payload (64 bytes)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.52", dest_ip = "8.8.8.8", udp = { source_port = 53002, dest_port = 53, payload = [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0a, 0x0b, 0x0c, 0x0d, 0x0e, 0x0f, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1a, 0x1b, 0x1c, 0x1d, 0x1e, 0x1f, 0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x28, 0x29, 0x2a, 0x2b, 0x2c, 0x2d, 0x2e, 0x2f, 0x30, 0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39, 0x3a, 0x3b, 0x3c, 0x3d, 0x3e, 0x3f] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

# packets without a payload must still work
[[tests]]
name = "TCP without payload (existing behavior)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.60", dest_ip = "8.8.8.8", tcp = { source_port = 45010, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests]]
name = "UDP without payload (existing behavior)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.61", dest_ip = "8.8.8.8", udp = { source_port = 53010, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

# ICMP payload, for comparison
[[tests]]
name = "ICMP with payload (existing feature)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.70", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0, payload = [0x61, 0x62, 0x63, 0x64, 0x65, 0x66, 0x67, 0x68] } }  # "abcdefgh"
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]
