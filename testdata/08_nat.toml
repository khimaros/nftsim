# Test suite 08: NAT (Network Address Translation)
#
# Tests SNAT (Source NAT / Masquerade) and DNAT (Destination NAT / Port Forwarding)

[network]
interfaces = [
  { name = "eth0", ip = "192.168.1.1/24" },
  { name = "eth1", ip = "203.0.113.10/24" },
]

routes = [
  { destination = "0.0.0.0/0", via = "203.0.113.1" },
]

[guest_setup]
sysctls = { "net.ipv4.ip_forward" = "1" }

# Test 1: SNAT with masquerade - Internal client accessing external server
[[tests]]
name = "SNAT Masquerade - Internal to External"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "8.8.8.8", tcp = { source_port = 45000, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "8.8.8.8", dest_ip = "203.0.113.10", tcp = { source_port = 80, dest_port = 45000, flags = ["SYN", "ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]

# Test 2: Explicit SNAT - Different source network
[[tests]]
name = "Explicit SNAT - 10.0.0.0/24 to 203.0.113.5"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "10.0.0.50", dest_ip = "8.8.8.8", tcp = { source_port = 50000, dest_port = 443, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.5" }
]

# Test 3: DNAT Port Forwarding - External request to public IP:80 -> Internal server:8080
[[tests]]
name = "DNAT Port Forward - External to Internal Server"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.2.3.4", dest_ip = "203.0.113.10", tcp = { source_port = 55000, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "192.168.1.50" },
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "1.2.3.4", tcp = { source_port = 8080, dest_port = 55000, flags = ["SYN", "ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" }
]

# Test 4: UDP SNAT - DNS query from internal network
[[tests]]
name = "UDP SNAT - Internal DNS Query"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", udp = { source_port = 40000, dest_port = 53 } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

# Test 5: ICMP SNAT - Ping from internal network
[[tests]]
name = "ICMP SNAT - Internal Ping"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.200", dest_ip = "8.8.8.8", icmp = { type = 8, code = 0 } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

# Test 6: SNAT persistence - multiple packets from same connection
[[tests]]
name = "SNAT Persistence - Connection Reuse"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "1.1.1.1", tcp = { source_port = 35000, dest_port = 443, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "1.1.1.1", dest_ip = "203.0.113.10", tcp = { source_port = 443, dest_port = 35000, flags = ["SYN", "ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.75", dest_ip = "1.1.1.1", tcp = { source_port = 35000, dest_port = 443, flags = ["ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

# Test 7: Multiple internal hosts, different external translations
[[tests]]
name = "Multiple Hosts SNAT - Same Public IP"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.10", dest_ip = "8.8.8.8", tcp = { source_port = 50001, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.11", dest_ip = "8.8.8.8", tcp = { source_port = 50002, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.12", dest_ip = "8.8.8.8", tcp = { source_port = 50003, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" },
  { hook = "postrouting", verdict = "accept", src_nat = "203.0.113.10" }
]

# Test 8: DNAT with established connection
[[tests]]
name = "DNAT Established Connection"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "5.6.7.8", dest_ip = "203.0.113.10", tcp = { source_port = 60000, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "192.168.1.50" },
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.50", dest_ip = "5.6.7.8", tcp = { source_port = 8080, dest_port = 60000, flags = ["SYN", "ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth1" }
]

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "5.6.7.8", dest_ip = "203.0.113.10", tcp = { source_port = 60000, dest_port = 80, flags = ["ACK"] } }
expect = [
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]

# Test 9: Bidirectional NAT - SNAT and DNAT on same packet flow
[[tests]]
name = "Bidirectional NAT - SNAT + DNAT"

[[tests.packets]]
packet = { on_interface = "eth1", source_ip = "9.10.11.12", dest_ip = "203.0.113.10", tcp = { source_port = 55500, dest_port = 80, flags = ["SYN"] } }
expect = [
  { hook = "prerouting", verdict = "accept", dst_nat = "192.168.1.50" },
  { hook = "forward", verdict = "accept", to_interface = "eth0" }
]
