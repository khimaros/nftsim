# Test 3: Mixed protocols high volume
[[tests]]
name = "Mixed Protocols - High Volume (15 packets)"

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.100", dest_ip = "8.8.8.8", tcp = { source_port = 30001, dest_port = 80, flags = ["SYN"] } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.101", dest_ip = "8.8.4.4", udp = { source_port = 30002, dest_port = 53 } }
expect = [ { hook = "forward", verdict = "accept", to_interface = "eth1" } ]

[[tests.packets]]
packet = { on_interface = "eth0", source_ip = "192.168.1.102", dest_ip = "1.1.1.1", icmp = { type = 8, code = 0 } }
