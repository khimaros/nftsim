[package]
name = "nftsim"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.50", features = ["derive"] }
libc = "0.2"
nix = { version = "0.30.1", features = ["user", "fs", "socket"] }
pnet_packet = "0.35.0"
serde = { version = "1.0.228", features = ["derive"] }
tempfile = "3.23.0"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "process", "time"] }
toml = "0.9.8"
